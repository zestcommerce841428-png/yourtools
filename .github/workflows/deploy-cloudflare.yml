name: Deploy to Cloudflare Workers

# Builds via the OpenNext Cloudflare adapter on GitHub's runner (not locally -
# this app's build needs more memory than an 8GB machine comfortably gives it),
# then deploys the Worker with wrangler.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Show runner resources
        run: free -h && nproc && df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Show disk space after install
        run: df -h

      - name: Build for Cloudflare Workers
        run: |
          ( while true; do
              echo "--- $(date -u +%H:%M:%S) resource snapshot ---"
              free -h
              df -h / 2>/dev/null | tail -1
              sleep 60
            done ) &
          MONITOR_PID=$!
          npm run cf:build
          BUILD_EXIT=$?
          kill $MONITOR_PID 2>/dev/null || true
          exit $BUILD_EXIT

      - name: Show disk space after build
        if: always()
        run: df -h

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
